<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <title>My Library</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
  </head>
  <body>
    <section class="header">
      <div class="header-content container">
        <div class="logo">My Library</div>
        <button class="btn">Login</button>
      </div>
    </section>

    <section class="books-section">
      <div class="btn-plus-container">
        <button class="btn-plus">ADD BOOK</button>
      </div>
      <div class="card-container"></div>
    </section>
    <footer>Jonatan Iaczinski || TOP Library</footer>
  </body>
  <section class="dialog-section">
    <dialog>
      <div class="dialog-container">
        <p>Add a New Book</p>
        <form class="cardForm">
          <div>
            <label for="newBook">Book Name:</label>
            <input type="text" id="newBook" name="title" />
          </div>
          <div>
            <label for="newAuthor">Author:</label>
            <input type="text" id="newAuthor" name="author" />
          </div>
          <div>
            <label for="newPages">Pages:</label>
            <input type="number" id="newPages" name="pages" />
          </div>
          <div>
            <label for="readStatus">Read Status:</label>
            <select id="readStatus" name="status" required>
              <option disabled selected value="">-- select an option --</option>
              <option value="read">READ</option>
              <option value="not-read">NOT READ</option>
            </select>
          </div>
          <div class="btns-dialog-card">
            <button id="close-btn" type="button">Close</button>
            <button id="submit-btn" type="submit">Submit</button>
          </div>
        </form>
      </div>
    </dialog>
  </section>
</html>
